# Publishes the site root to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Branch deploy also works: Settings -> Pages -> Deploy from a branch -> main -> / (root).

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js favicon.svg .nojekyll _site/
          cp data/shows.json _site/data/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
